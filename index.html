<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5">
<title>Site Ledger</title>
<style>
:root{
  --bg:#F7F7F5;--surface:#FFFFFF;--surface-2:#F2F2EF;
  --ink:#1A1A1A;--ink-2:#6B6B6B;--ink-3:#9A9A97;
  --accent:#2F6E4F;--accent-soft:#E7F0EB;
  --loan:#B5842A;--loan-soft:#F6EEDC;
  --spend:#C4553A;--spend-soft:#F8E9E4;
  --line:#E7E7E3;--line-2:#DADAD5;
  --radius:14px;--radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;padding-bottom:calc(72px + var(--safe-bottom));}
.container{max-width:900px;margin:0 auto;padding:0 16px;}
.header{padding:calc(20px + var(--safe-top)) 0 12px;display:flex;justify-content:space-between;align-items:center;}
.brand{display:flex;align-items:center;gap:10px;}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.8;}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.02em;}
.header-actions{display:flex;align-items:center;gap:8px;}
.user-chip{display:none;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:4px 10px 4px 4px;max-width:170px;}
.user-chip.show{display:flex;}
.user-chip img{width:22px;height:22px;border-radius:6px;object-fit:cover;}
.user-chip span{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.settings-btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px;cursor:pointer;color:var(--ink-2);display:flex;}
.settings-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;}
.settings-btn:hover{color:var(--ink);}
.login-screen{display:none;position:fixed;inset:0;z-index:90;background:var(--bg);align-items:center;justify-content:center;padding:calc(28px + var(--safe-top)) 16px calc(28px + var(--safe-bottom));}
.login-screen.show{display:flex;}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.06);}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.login-card h2{font-size:22px;font-weight:600;margin:0 0 8px;letter-spacing:-.03em;}
.login-card .lead{color:var(--ink-2);font-size:14px;margin:0 0 20px;}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-family:inherit;font-weight:550;font-size:15px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:12px 16px;cursor:pointer;}
.google-btn:hover{background:var(--surface-2);}
.google-btn:disabled{opacity:.55;cursor:default;}
.google-btn svg{width:18px;height:18px;}
#app[hidden]{display:none;}
.sync-pill{font-size:11px;color:var(--ink-3);margin:0 0 14px;display:flex;align-items:center;gap:6px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);}
.sync-dot.on{background:var(--accent);}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.avail-block{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.avail-label{font-size:12px;color:var(--ink-2);margin:0 0 5px;font-weight:500;}
.avail-value{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:33px;font-weight:600;margin:0;letter-spacing:-.02em;line-height:1;}
.avail-value.negative{color:var(--spend);}
.avail-hint{font-size:11.5px;color:var(--ink-3);text-align:right;max-width:190px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.stat-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.stat-label{font-size:11.5px;color:var(--ink-2);margin:0 0 4px;font-weight:500;}
.stat-value{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:16px;font-weight:600;margin:0;}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding:4px;background:var(--surface-2);border-radius:12px;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{font-family:inherit;font-weight:500;font-size:13px;background:transparent;border:none;border-radius:9px;padding:9px 14px;cursor:pointer;color:var(--ink-2);white-space:nowrap;flex-shrink:0;transition:.15s;}
.tab-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.panel-title{font-size:16px;font-weight:600;margin:0;}
.panel-desc{font-size:12.5px;color:var(--ink-2);margin:3px 0 0;max-width:56ch;}
.add-btn{font-family:inherit;font-weight:500;font-size:13.5px;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:10px 15px;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;}
.add-btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;}
.entry-list{display:flex;flex-direction:column;gap:9px;}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px;}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.entry-name{font-weight:550;font-size:15px;margin:0;}
.entry-sub{font-size:12.5px;color:var(--ink-2);margin:3px 0 0;}
.entry-amount{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600;font-size:15px;white-space:nowrap;}
.entry-meta{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:11px;font-size:12px;color:var(--ink-2);align-items:center;}
.meta-item strong{color:var(--ink);font-weight:600;}
.entry-actions{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap;}
.icon-btn{font-family:inherit;font-size:12.5px;font-weight:500;background:transparent;border:1px solid var(--line-2);cursor:pointer;color:var(--ink-2);padding:6px 12px;border-radius:8px;transition:.12s;}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn.danger:hover{background:var(--spend-soft);color:var(--spend);border-color:var(--spend);}
.icon-btn.good{color:var(--accent);border-color:#BCD8C8;}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid var(--line-2);cursor:pointer;flex-shrink:0;}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
.chip.pending{color:var(--spend);background:var(--spend-soft);}
.chip.progress{color:#2D5A8A;background:#E5EEF7;}
.chip.done{color:var(--accent);background:var(--accent-soft);}
.tag{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--ink-2);background:var(--surface-2);padding:2px 8px;border-radius:6px;}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:11px;}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px;}
.bar span.over{background:var(--spend);}
.empty-state{text-align:center;padding:44px 16px;color:var(--ink-2);}
.empty-state .big{font-size:14.5px;color:var(--ink);margin-bottom:5px;font-weight:550;}
.empty-state .small{font-size:13px;}
.loading{text-align:center;padding:48px;color:var(--ink-3);font-size:13px;}
.overlay{display:none;min-height:100vh;background:rgba(26,26,26,.42);align-items:flex-start;justify-content:center;padding:calc(28px + var(--safe-top)) 16px 28px;position:fixed;inset:0;z-index:40;overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:460px;padding:22px 22px 20px;box-shadow:0 12px 40px rgba(0,0,0,.16);margin:auto 0;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.modal-title{font-size:18px;font-weight:600;margin:0;letter-spacing:-.02em;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--ink-2);padding:4px;border-radius:6px;font-size:22px;line-height:1;}
.modal-sub{font-size:13px;color:var(--ink-2);margin:0 0 18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
.field label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:6px;}
.field input,.field select{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink);appearance:none;-webkit-appearance:none;}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236B6B6B' d='M1 1l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.field.wide{grid-column:1/-1;}
.model-row{display:flex;gap:8px;align-items:stretch;}
.model-row select{flex:1;min-width:0;}
.model-row .set-btn{flex-shrink:0;white-space:nowrap;}
.model-filter{margin-bottom:8px;}
.field-hint.err{color:var(--spend);}
.photo-field{grid-column:1/-1;}
.ocr-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:550;font-size:14px;background:var(--accent-soft);color:var(--accent);border:1px solid #BCD8C8;border-radius:9px;padding:12px 16px;cursor:pointer;width:100%;}
.ocr-btn:disabled{opacity:.55;cursor:default;}
.ocr-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;}
.field-hint{font-size:11px;color:var(--ink-3);margin:4px 0 0;line-height:1.4;}
.req::after{content:' *';color:var(--spend);}
.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;}
.photo-btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-weight:500;font-size:13.5px;background:var(--surface-2);color:var(--ink);border:1px dashed var(--line-2);border-radius:9px;padding:11px 12px;cursor:pointer;width:100%;justify-content:center;margin-top:0;}
.inline-ai{margin-top:10px;padding:12px;background:var(--surface-2);border-radius:9px;}
.inline-ai p{font-size:12px;color:var(--ink-2);margin:0 0 10px;}
.photo-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;}
.photo-preview{margin-top:11px;display:none;align-items:flex-start;gap:12px;}
.photo-preview.show{display:flex;}
.photo-preview img{width:90px;height:90px;object-fit:cover;border-radius:9px;border:1px solid var(--line-2);}
.photo-remove{font-size:12.5px;color:var(--spend);background:none;border:none;cursor:pointer;padding:4px 0;font-weight:500;}
.ocr-status{font-size:12.5px;color:var(--ink-2);margin-top:9px;display:none;}
.ocr-status.show{display:block;}
.ocr-status.err{color:var(--spend);}
.error-text{color:var(--spend);font-size:13px;margin:12px 0 0;display:none;font-weight:500;}
.error-text.show{display:block;}
.modal-actions{margin-top:20px;display:flex;gap:9px;}
.btn-primary{flex:1;font-family:inherit;font-weight:550;font-size:14.5px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;cursor:pointer;}
.btn-cancel{font-family:inherit;font-weight:500;font-size:14.5px;background:transparent;color:var(--ink-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 20px;cursor:pointer;}
.set-section{margin-bottom:22px;}
.set-section h3{font-size:13px;font-weight:600;margin:0 0 4px;}
.set-section p.hint{font-size:12px;color:var(--ink-2);margin:0 0 12px;}
.set-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px;}
.set-btn{font-family:inherit;font-size:13px;font-weight:500;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:10px 14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;}
a.set-btn:hover{background:var(--line);}
.google-btn:focus-visible,.add-btn:focus-visible,.btn-primary:focus-visible,.settings-btn:focus-visible,.tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.set-btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.set-note{font-size:11.5px;color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:8px;line-height:1.5;}
.set-note a{color:var(--accent);font-weight:550;}
.lightbox{display:none;min-height:100vh;background:rgba(20,20,20,.9);align-items:center;justify-content:center;padding:24px;position:fixed;inset:0;z-index:60;}
.lightbox.show{display:flex;}
.lightbox img{max-width:100%;max-height:82vh;border-radius:12px;}
.lightbox-close{position:absolute;top:18px;right:22px;font-size:30px;color:#fff;background:none;border:none;cursor:pointer;}
.toast{position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;}
@media (max-width:560px){
  .avail-value{font-size:28px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:14px 12px;}
  .avail-hint{display:none;}
  .overlay{align-items:flex-end;padding:0;}
  .modal{max-width:none;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + var(--safe-bottom));}
  .form-grid{grid-template-columns:1fr;}
  .modal-actions{flex-direction:column-reverse;}
  .btn-cancel,.btn-primary{width:100%;}
}
</style>
</head>
<body>
<div class="login-screen show" id="login-screen"><div class="login-card" id="login-card"></div></div>
<div class="container" id="app" hidden>
  <div class="header">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/></svg></div>
      <h1>Site Ledger</h1>
    </div>
    <div class="header-actions">
      <div class="user-chip" id="user-chip"><img id="user-pic" alt=""><span id="user-name"></span></div>
      <button class="settings-btn" id="open-settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </div>
  <p class="sync-pill" id="sync-pill"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Local only</span></p>

  <div class="summary">
    <div class="avail-block">
      <div><p class="avail-label">Available funds now</p><p class="avail-value" id="avail-value">—</p></div>
      <p class="avail-hint">Loan received + own cash − everything spent</p>
    </div>
    <div class="stat-grid">
      <div><p class="stat-label"><span class="stat-dot" style="background:var(--loan)"></span>Loan received</p><p class="stat-value" id="stat-loan" style="color:var(--loan)">—</p></div>
      <div><p class="stat-label"><span class="stat-dot" style="background:var(--ink-2)"></span>Own cash</p><p class="stat-value" id="stat-cash">—</p></div>
      <div><p class="stat-label"><span class="stat-dot" style="background:var(--spend)"></span>Spent</p><p class="stat-value" id="stat-spent" style="color:var(--spend)">—</p></div>
      <div><p class="stat-label"><span class="stat-dot" style="background:var(--accent)"></span>Pending</p><p class="stat-value" id="stat-pending">—</p></div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="funds">Funds</button>
    <button class="tab-btn" data-tab="budget">Budget</button>
    <button class="tab-btn" data-tab="actions">Actions</button>
    <button class="tab-btn" data-tab="sellers">Sellers</button>
    <button class="tab-btn" data-tab="purchases">Purchases</button>
  </div>
  <div id="panel-root"><div class="loading">Loading your ledger…</div></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="overlay" id="settings-overlay"><div class="modal" id="settings-modal"></div></div>
<div class="lightbox" id="lightbox"><button class="lightbox-close" id="lightbox-close">&times;</button><img id="lightbox-img" src="" alt="Receipt"></div>
<div class="toast" id="toast"></div>

<datalist id="category-options">
  <option value="Foundation"><option value="Structure / Masonry"><option value="Roofing">
  <option value="Electrical"><option value="Plumbing"><option value="Tiles / Flooring">
  <option value="Doors / Windows"><option value="Paint / Finishing"><option value="Kitchen">
  <option value="Bathroom"><option value="Labour"><option value="Permits / Fees"><option value="Other">
</datalist>

<script>
/* ============ Site Ledger — local-first PWA ============ */
const CUR='Rs ';
/* Public OAuth Web client ID — not a secret. Leave empty to paste it on first login. */
const GOOGLE_CLIENT_ID='379149446558-pk7favl7g2hj1dugkhqog4kbb56aut0r.apps.googleusercontent.com';
const PROFILE_FILE='site-ledger-settings.json';
const CSV_FILE='site-ledger.csv';
const money=n=>CUR+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const todayStr=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

/* ---- IndexedDB tiny wrapper ---- */
const DB_NAME='siteledger',STORES=['funds','budget','actions','sellers','purchases','meta'];
let db;
function openDB(){return new Promise((res,rej)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='meta'?'k':'id'});});};
  req.onsuccess=e=>{db=e.target.result;res();};
  req.onerror=e=>rej(e.target.error);
});}
function tx(store,mode){return db.transaction(store,mode).objectStore(store);}
function idbAll(store){return new Promise((res,rej)=>{const r=tx(store,'readonly').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function idbPut(store,val){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(val);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function idbDel(store,id){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function idbGetMeta(k){return new Promise((res)=>{const r=tx('meta','readonly').get(k);r.onsuccess=()=>res(r.result?r.result.v:null);r.onerror=()=>res(null);});}
function idbSetMeta(k,v){return idbPut('meta',{k,v});}

let state={funds:[],budget:[],actions:[],sellers:[],purchases:[]};
let settings={provider:'openai',apiKey:'',model:'',apiBase:'',models:[],profiles:{},driveClientId:'',driveToken:null,driveFolderId:'',user:null,userSub:'',autoCsv:true};
let activeTab='funds',editing=null,editKind=null,pendingPhoto=null,pendingFullPhoto=null,photoCleared=false;
function finiteNum(s){const n=+s;return s!==''&&Number.isFinite(n);}

async function loadAll(){for(const s of ['funds','budget','actions','sellers','purchases'])state[s]=await idbAll(s);
  const st=await idbGetMeta('settings');if(st)settings=Object.assign(settings,st);}
async function persist(store){
  await new Promise((res,rej)=>{
    const t=db.transaction(store,'readwrite');const os=t.objectStore(store);os.clear();
    for(const row of state[store])os.put(row);
    t.oncomplete=()=>res();t.onerror=()=>rej(t.error);
  });
}
function snapshotAi(){
  return{provider:settings.provider,apiKey:settings.apiKey||'',model:settings.model||'',apiBase:settings.apiBase||'',models:Array.isArray(settings.models)?settings.models.slice(0,400):[],driveFolderId:settings.driveFolderId||''};
}
function applyAi(p){
  if(!p)return;
  if(p.provider)settings.provider=p.provider;
  if(p.apiKey!=null)settings.apiKey=p.apiKey;
  if(p.model!=null)settings.model=p.model;
  if(p.apiBase!=null)settings.apiBase=p.apiBase;
  if(Array.isArray(p.models))settings.models=p.models.slice(0,400);
  if(p.driveFolderId!=null)settings.driveFolderId=p.driveFolderId;
}
function stashAi(sub){
  if(!sub)return;
  if(!settings.profiles||typeof settings.profiles!=='object')settings.profiles={};
  settings.profiles[sub]=snapshotAi();
}
function applyStashedAi(sub){
  if(!sub)return;
  const p=settings.profiles&&settings.profiles[sub];
  if(!p){settings.apiKey='';settings.model='';settings.apiBase='';settings.models=[];settings.driveFolderId='';return;}
  applyAi(p);
}
async function saveSettings(){
  if(settings.userSub)stashAi(settings.userSub);
  const snap=Object.assign({},settings,{driveToken:null});
  await idbSetMeta('settings',snap);
}
async function persistAiToProfile(){
  await saveSettings();
  try{await saveProfileToDrive();}catch(e){}
}

const loanReceived=()=>state.funds.filter(f=>f.type==='loan').reduce((s,f)=>s+(+f.amount||0),0);
const ownCash=()=>state.funds.filter(f=>f.type==='cash').reduce((s,f)=>s+(+f.amount||0),0);
const totalSpent=()=>state.purchases.reduce((s,p)=>s+(+p.price||0),0);
const spentForCat=c=>state.purchases.filter(p=>(p.category||'').toLowerCase()===String(c||'').toLowerCase()).reduce((s,p)=>s+(+p.price||0),0);
function computeSummary(){
  const loan=loanReceived(),cash=ownCash(),spent=totalSpent(),avail=loan+cash-spent;
  const av=$('avail-value');av.textContent=money(avail);av.classList.toggle('negative',avail<0);
  $('stat-loan').textContent=money(loan);$('stat-cash').textContent=money(cash);
  $('stat-spent').textContent=money(spent);$('stat-pending').textContent=state.actions.filter(a=>a.status!=='done').length;
}

function bindModal(){
  $('modal-close').onclick=closeModal;$('modal-cancel').onclick=closeModal;$('modal-save').onclick=saveModal;
  $('modal').addEventListener('keydown',e=>{
    if(e.key!=='Enter'||!e.target||e.target.id==='modal-save')return;
    if(e.target.tagName==='BUTTON'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.target.closest&&e.target.closest('#inline-ai'))return;
    e.preventDefault();saveModal();
  });
  const onFile=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;photoCleared=false;await handlePhoto(f);};
  const pin=$('m-photo');if(pin)pin.addEventListener('change',onFile);
  const cam=$('m-photo-cam');if(cam)cam.addEventListener('change',onFile);
  const prm=$('m-photo-remove');
  if(prm)prm.onclick=()=>{pendingPhoto=null;pendingFullPhoto=null;photoCleared=true;const pv=$('m-photo-preview');if(pv)pv.classList.remove('show');['m-photo','m-photo-cam'].forEach(id=>{const el=$(id);if(el)el.value='';});};
  const ocr=$('m-ocr');
  if(ocr)ocr.onclick=startReceiptScan;
  wireModelPicker('m-ai','m-ai-custom');
}
async function saveInlineAiKey(){
  const k=$('m-ai-key'),p=$('m-ai-provider'),b=$('m-ai-base');
  if(p)settings.provider=p.value;
  if(k&&k.value.trim())settings.apiKey=k.value.trim();
  if(b)settings.apiBase=b.value.trim();
  const model=readModelValue('m-ai');
  if(model||settings.provider==='custom')settings.model=model;
  const modelSel=$('m-ai-model');if(modelSel&&Array.isArray(modelSel._allModels)&&modelSel._allModels.length)settings.models=modelSel._allModels.slice(0,400);
  if(!settings.apiKey)return false;
  if(settings.provider==='custom'&&(!settings.apiBase||!settings.model))return false;
  await persistAiToProfile();
  return true;
}
async function startReceiptScan(){
  if(!settings.apiKey||(settings.provider==='custom'&&(!settings.apiBase||!settings.model))){
    const ok=await saveInlineAiKey();
    if(!ok){
      const custom=settings.provider==='custom';
      ocrStatus(custom?($('m-ai-base')?'Enter the API URL, model name, and key.':'Open Settings and enter the custom API URL and model.'):'Paste your AI API key above, or in Settings.',true);
      const focus=$('m-ai-base')||$('m-ai-key');if(focus)focus.focus();return;}
  }
  let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;photoCleared=false;await handlePhoto(f);await runOCR();};
  inp.click();
}
async function handlePhoto(file){
  pendingFullPhoto=await compressImage(file,1600,0.7);   // full-res for Drive/OCR
  pendingPhoto=await compressImage(file,400,0.6);        // thumbnail on-device
  const img=$('m-photo-img'),pv=$('m-photo-preview');
  if(img&&pv){img.src=pendingPhoto;pv.classList.add('show');}
}
function ocrStatus(msg,err){const el=$('m-ocr-status');if(!el)return;el.textContent=msg;el.classList.add('show');el.classList.toggle('err',!!err);}
async function runOCR(){
  const btn=$('m-ocr');if(btn)btn.disabled=true;
  ocrStatus('Reading receipt with '+(settings.provider==='custom'?(settings.model||'custom model'):settings.provider)+'…',false);
  try{
    const data=await callVisionOCR(pendingFullPhoto||pendingPhoto);
    if(data.seller&&$('m-seller')&&!$('m-seller').value)$('m-seller').value=data.seller;
    if(data.date&&$('m-date'))$('m-date').value=data.date;
    if(data.total!=null&&$('m-price'))$('m-price').value=data.total;
    if(data.item&&$('m-item')&&!$('m-item').value)$('m-item').value=data.item;
    if(data.category&&$('m-category')&&!$('m-category').value)$('m-category').value=data.category;
    if(data.receipt&&$('m-receipt')&&!$('m-receipt').value)$('m-receipt').value=data.receipt;
    ocrStatus('Filled from receipt — please double-check the amounts.',false);
  }catch(err){console.error(err);ocrStatus('Couldn\'t read receipt: '+(err.message||'error')+'. Enter details manually.',true);}
  if(btn)btn.disabled=false;

function parseModelsList(json){

    .filter(id=>{if(seen[id])return false;seen[id]=1;return true;});
  ids.sort((a,b)=>{
    const rank=id=>{const s=id.toLowerCase();return (/vision|vl-|gpt-4o|4o-mini|omni|gpt-4\.1/.test(s)?'0':'1')+s;};

async function listProviderModels(provider,apiKey,apiBase){

function wireModelPicker(ns,customWrapId){

    if(!s.apiKey){paint(modelEl._allModels||[],readModelValue(ns),'Paste your API key, then tap Load.',true);return;}

  if(!res.ok){

function compressImage(file,maxDim,quality){maxDim=maxDim||1000;quality=quality||0.6;
  return new Promise((res,rej)=>{const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',quality));};img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);});}

function toCSV(){
  const lines=[];
  const push=(section,rows,cols)=>{lines.push('#'+section);lines.push(cols.join(','));
    rows.forEach(r=>lines.push(cols.map(c=>csvCell(r[c])).join(',')));lines.push('');};
  push('funds',state.funds,['id','type','label','amount','date','notes']);
  push('budget',state.budget,['id','category','budgeted','notes']);
  push('actions',state.actions,['id','title','due','status','notes']);
  push('sellers',state.sellers,['id','name','contact','item','price','status','notes']);
  push('purchases',state.purchases,['id','item','category','seller','price','date','receipt','driveLink']);
  return lines.join('\n');
}
function csvCell(v){if(v==null)return '';v=String(v);if(/[",\n]/.test(v))return '"'+v.replace(/"/g,'""')+'"';return v;}
function parseCSVLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];
  if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
  else{if(ch==='"')q=true;else if(ch===','){out.push(cur);cur='';}else cur+=ch;}}out.push(cur);return out;}
function fromCSV(text){
  const lines=text.split(/\r?\n/);let section=null,cols=null;const fresh={funds:[],budget:[],actions:[],sellers:[],purchases:[]};
  for(const raw of lines){if(!raw.trim()){cols=null;continue;}
    if(raw[0]==='#'){section=raw.slice(1).trim();cols=null;continue;}
    if(!section||!fresh[section])continue;
    if(!cols){cols=parseCSVLine(raw);continue;}
    const vals=parseCSVLine(raw),o={};cols.forEach((c,i)=>o[c]=vals[i]!==undefined?vals[i]:'');
    ['amount','budgeted','price'].forEach(n=>{if(o[n]!==undefined&&o[n]!=='')o[n]=+o[n];});
    if(!o.id)o.id=uid();fresh[section].push(o);}
  return fresh;
}
function downloadCSV(){const csv=toCSV();const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='site-ledger-'+todayStr()+'.csv';a.click();URL.revokeObjectURL(url);toast('CSV exported');}
async function importCSVFile(file){const text=await file.text();const fresh=fromCSV(text);

  state=fresh;for(const s of ['funds','budget','actions','sellers','purchases'])await persist(s);render();toast('CSV imported');}

  }
  applyStashedAi(u.sub);
  settings.user={email:u.email,name:u.name,picture:u.picture};settings.userSub=u.sub;settings.autoCsv=true;
  await saveSettings();
  hideLogin();updateUserChip();render();
  try{
    const existed=!!settings.driveFolderId;
    await ensureDriveFolder();
    await loadProfileFromDrive();
    await saveProfileToDrive();
    await pullCsvFromDriveIfEmpty();
    await saveSettings();updateUserChip();render();scheduleCsvSync();
    if(!quiet&&!existed)toast('Drive folder: My Drive → Site Ledger');
  }catch(e){if(!quiet)toast(e.message||'Signed in, but Drive sync is not ready yet');}
}
async function googleLogout(){
  const tok=settings.driveToken;
  if(tok&&window.google&&google.accounts&&google.accounts.oauth2)try{google.accounts.oauth2.revoke(tok,()=>{});}catch(e){}
  stashAi(settings.userSub);
  settings.apiKey='';settings.model='';settings.apiBase='';settings.models=[];
  settings.driveToken=null;settings.user=null;settings.userSub='';
  await saveSettings();updateUserChip();showLogin();toast('Signed out');
}
function updateUserChip(){
  const chip=$('user-chip');if(!chip)return;
  if(!settings.user){chip.classList.remove('show');return;}
  $('user-pic').src=settings.user.picture||'';$('user-name').textContent=settings.user.name||settings.user.email||'Signed in';
  chip.classList.add('show');
}
function driveApiEnableUrl(){
  const cid=appClientId()||GOOGLE_CLIENT_ID||'';
  const proj=(cid.match(/^(\d+)/)||[])[1];
  return 'https://console.cloud.google.com/apis/library/drive.googleapis.com'+(proj?('?project='+proj):'');
}
async function driveFetch(url,opts){opts=opts||{};opts.headers=Object.assign({'Authorization':'Bearer '+settings.driveToken},opts.headers||{});
  const r=await fetch(url,opts);
  if(r.status===401){settings.driveToken=null;throw new Error('Drive session expired — sign in again');}
  if(!r.ok){
    let msg='Google Drive error '+r.status,reason='';
    try{const j=await r.json();if(j.error&&j.error.message)msg=j.error.message;if(j.error&&j.error.errors&&j.error.errors[0])reason=j.error.errors[0].reason||'';}catch(e){}
    if(r.status===403&&(/accessNotConfigured|has not been used|is disabled|Drive API/i.test(msg+' '+reason)))
      msg='Enable the Google Drive API (click Enable Drive API in Settings), wait a minute, then tap Create Drive folder.';
    throw new Error(msg);
  }
  return r;}
async function ensureDriveFolder(){
  if(!settings.driveToken)throw new Error('Sign in first');
  if(settings.driveFolderId){
    try{
      const chk=await driveFetch('https://www.googleapis.com/drive/v3/files/'+settings.driveFolderId+'?fields=id,name,trashed');
      const info=await chk.json();
      if(info.id&&!info.trashed)return settings.driveFolderId;
    }catch(e){settings.driveFolderId='';}
  }
  const q=encodeURIComponent("name='Site Ledger' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)&spaces=drive');
  const j=await r.json();
  if(j.files&&j.files.length){settings.driveFolderId=j.files[0].id;}
  else{
    const cr=await driveFetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:'Site Ledger',mimeType:'application/vnd.google-apps.folder',parents:['root']})});
    const cj=await cr.json();
    if(!cj.id)throw new Error('Google did not create the Site Ledger folder');
    settings.driveFolderId=cj.id;
  }
  await saveSettings();
  return settings.driveFolderId;
}
async function findDriveFile(name){
  await ensureDriveFolder();
  const q=encodeURIComponent("name='"+name+"' and '"+settings.driveFolderId+"' in parents and trashed=false");
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)');
  const j=await r.json();return (j.files&&j.files[0]&&j.files[0].id)||null;
}
async function upsertDriveFile(name,blob){
  const id=await findDriveFile(name);const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(id?{name}:{name,parents:[settings.driveFolderId]})],{type:'application/json'}));
  form.append('file',blob);
  if(id)await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=multipart',{method:'PATCH',body:form});
  else await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',body:form});
}
async function loadProfileFromDrive(){
  const id=await findDriveFile(PROFILE_FILE);if(!id)return;
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');if(!r.ok)return;
  const p=await r.json();
  applyAi(p);
}
async function saveProfileToDrive(){
  if(!settings.driveToken)return;
  const body=snapshotAi();
  const blob=new Blob([JSON.stringify({provider:body.provider,apiKey:body.apiKey,model:body.model,apiBase:body.apiBase,models:body.models,autoCsv:true})],{type:'application/json'});
  await upsertDriveFile(PROFILE_FILE,blob);
}
async function pullCsvFromDriveIfEmpty(){
  const empty=['funds','budget','actions','sellers','purchases'].every(s=>!state[s].length);if(!empty)return;
  const id=await findDriveFile(CSV_FILE);if(!id)return;
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');if(!r.ok)return;
  const fresh=fromCSV(await r.text());state=fresh;for(const s of ['funds','budget','actions','sellers','purchases'])await persist(s);
}
function dataURLtoBlob(d){const [meta,b64]=d.split(',');const mime=(meta.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
async function uploadPhotoToDrive(dataUrl,name){
  await ensureDriveFolder();
  const meta={name:'receipt-'+todayStr()+'-'+name.slice(0,20).replace(/[^a-z0-9]/gi,'_')+'.jpg',parents:[settings.driveFolderId]};
  const blob=dataURLtoBlob(dataUrl);
  const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',blob);
  const r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{method:'POST',body:form});
  return await r.json();
}
let csvSyncT;function scheduleCsvSync(){clearTimeout(csvSyncT);csvSyncT=setTimeout(syncCsvToDrive,1500);}
async function syncCsvToDrive(){
  if(!settings.driveToken)return;try{
    await upsertDriveFile(CSV_FILE,new Blob([toCSV()],{type:'text/csv'}));toast('Synced to Drive');
  }catch(e){toast(e.message||'Drive sync failed');}
}
function updateSyncPill(){const on=!!settings.driveToken;$('sync-dot').classList.toggle('on',on);
  $('sync-text').textContent=on?(settings.user&&settings.user.email?'Signed in as '+settings.user.email:'Synced to Google Drive'):'Sign in required';}

/* ---- settings ---- */
$('open-settings').onclick=()=>{renderSettings();$('settings-overlay').classList.add('show');};
$('settings-overlay').addEventListener('click',e=>{if(e.target.id==='settings-overlay')$('settings-overlay').classList.remove('show');});
function renderSettings(){
  const who=settings.user?(settings.user.name||settings.user.email):'';
  $('settings-modal').innerHTML=
    '<div class="modal-head"><p class="modal-title">Settings</p><button class="modal-close" id="set-close">&times;</button></div>'+
    '<div class="set-section"><h3>Google account</h3><p class="hint">'+(who?'Signed in as <b>'+esc(who)+'</b>.':'Not signed in.')+'</p>'+
    '<div class="set-row"><button class="set-btn accent" id="drive-syncnow">Sync now</button>'+
    '<button class="set-btn" id="drive-create">Create Drive folder</button>'+
    '<a class="set-btn" id="drive-enable-api" href="'+esc(driveApiEnableUrl())+'" target="_blank" rel="noopener">Enable Drive API</a>'+
    (settings.driveFolderId?'<a class="set-btn" id="drive-open" href="https://drive.google.com/drive/folders/'+esc(settings.driveFolderId)+'" target="_blank" rel="noopener">Open Drive folder</a>':'')+
    '<button class="set-btn" id="google-logout">Sign out</button></div>'+
    '<div class="set-note">Folder: <b>drive.google.com → My Drive → Site Ledger</b>. If Create Drive folder fails, tap <b>Enable Drive API</b> (same Google Cloud project as this app), click <b>Enable</b>, wait about a minute, come back, then tap Create Drive folder.</div></div>'+
    '<div class="set-section"><h3>AI receipt scanning</h3><p class="hint">Paste your own key for OpenAI, Qwen, DeepSeek, or any OpenAI-compatible API. Saved to your Drive, then loaded on any device when you sign in.</p>'+
    '<div class="field" style="margin-bottom:10px"><label>Provider</label><select id="set-provider">'+providerOptionsHtml()+'</select></div>'+
    '<div id="set-custom" style="display:none">'+
    '<div class="field" style="margin-bottom:10px"><label class="req">API base URL</label><input id="set-base" value="'+esc(settings.apiBase)+'" placeholder="https://api.example.com/v1" autocomplete="off">'+
    '<p class="field-hint">Works with Groq, OpenRouter, Ollama, LM Studio, vLLM, and similar. Use the /v1 root or the full /v1/chat/completions URL.</p></div></div>'+
    '<div class="field" style="margin-bottom:10px"><label>API key</label><input id="set-key" type="password" value="'+esc(settings.apiKey)+'" placeholder="sk-… or your provider key" autocomplete="off"></div>'+
    modelPickerHtml('set')+
    '<div class="set-note">Provider, key, chosen model, and the model list are saved to <b>your</b> Google Drive profile. They load again when you sign in on any device.</div></div>'+
    '<div class="set-section"><h3>Manual backup (CSV)</h3><p class="hint">Export a local copy, or import to replace current data.</p>'+
    '<div class="set-row"><button class="set-btn" id="csv-export">Export CSV</button>'+
    '<button class="set-btn" id="csv-import">Import CSV</button>'+
    '<input type="file" accept=".csv,text/csv" id="csv-file" style="display:none"></div></div>'+
    '<div class="modal-actions"><button class="btn-primary" id="set-save">Save settings</button></div>';
  $('set-close').onclick=()=>$('settings-overlay').classList.remove('show');
  wireModelPicker('set','set-custom');
  $('set-save').onclick=async()=>{
    settings.provider=$('set-provider').value;settings.apiKey=$('set-key').value.trim();
    settings.model=readModelValue('set');
    const baseEl=$('set-base');if(baseEl)settings.apiBase=baseEl.value.trim();
    const modelSel=$('set-model');if(modelSel&&Array.isArray(modelSel._allModels)&&modelSel._allModels.length)settings.models=modelSel._allModels.slice(0,400);
    if(settings.provider==='custom'){
      if(!settings.apiBase){toast('Enter the custom API base URL');return;}
      if(!settings.model){toast('Choose a model, or tap Other to type one');return;}
      try{chatCompletionsUrl(settings.apiBase);}catch(e){toast(e.message);return;}
    }
    await saveSettings();
    try{await saveProfileToDrive();toast('Saved to your Google profile');}catch(e){toast(e.message||'Saved on this device only');}
    updateSyncPill();$('settings-overlay').classList.remove('show');
  };
  $('csv-export').onclick=downloadCSV;
  $('csv-import').onclick=()=>$('csv-file').click();
  $('csv-file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)importCSVFile(f);};
  const ds=$('drive-syncnow');if(ds)ds.onclick=syncCsvToDrive;
  const mk=$('drive-create');if(mk)mk.onclick=async()=>{
    try{
      await ensureDriveFolder();await saveProfileToDrive();await saveSettings();
      toast('Folder ready: My Drive → Site Ledger');renderSettings();
    }catch(e){toast(e.message||'Could not create Drive folder');}
  };
  const lo=$('google-logout');if(lo)lo.onclick=googleLogout;
}

/* ---- init ---- */
(async function init(){
  renderLogin();
  try{
    await openDB();await loadAll();
    lastClientId=GOOGLE_CLIENT_ID||settings.driveClientId||'';
    await loadGis();
    if(settings.user&&appClientId()){
      hideLogin();updateUserChip();render();
      startGoogleLogin(true);
      return;
    }
  }catch(e){console.error(e);}
  renderLogin();
})();
</script>
