<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E9F6E">
<title>Site Ledger</title>
<link rel="stylesheet" href="css/app.css?v=20260818o">
</head>
<body>
<div class="login-screen show" id="login-screen"><div class="login-card" id="login-card"></div></div>
<div class="container" id="app" hidden>
  <div class="header">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/></svg></div>
      <h1>Site Ledger</h1><span class="build-tag" id="build-tag"></span>
    </div>
    <div class="header-actions">
      <div class="user-chip" id="user-chip"><img id="user-pic" alt=""><span id="user-name"></span></div>
      <button class="chat-btn" id="open-chat" aria-label="AI Chat"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
      <button class="settings-btn" id="open-settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </div>
  <p class="sync-pill" id="sync-pill"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Local only</span></p>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="funds">Funds</button>
    <button class="tab-btn" data-tab="budget">Budget</button>
    <button class="tab-btn" data-tab="actions">Actions</button>
    <button class="tab-btn" data-tab="sellers">Sellers</button>
    <button class="tab-btn" data-tab="purchases">Purchases</button>
  </div>
  <div id="panel-root"><div class="loading">Loading your ledger…</div></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="overlay" id="settings-overlay"><div class="modal" id="settings-modal"></div></div>
<div class="lightbox" id="lightbox"><button class="lightbox-close" id="lightbox-close">&times;</button><img id="lightbox-img" src="" alt="Receipt"></div>
<div class="toast" id="toast"></div>

<datalist id="category-options">
  <option value="Foundation"><option value="Structure / Masonry"><option value="Roofing">
  <option value="Electrical"><option value="Plumbing"><option value="Tiles / Flooring">
  <option value="Doors / Windows"><option value="Paint / Finishing"><option value="Kitchen">
  <option value="Bathroom"><option value="Labour"><option value="Permits / Fees"><option value="Other">
</datalist>

<div class="chat-panel" id="chat-panel">
  <div class="chat-head"><p class="chat-title">AI Assistant</p><button class="chat-close" id="chat-close">&times;</button></div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-row"><input id="chat-input" placeholder="Ask about your budget…" autocomplete="off"><button id="chat-send" class="chat-send-btn">Send</button></div>
</div>

<script type="module" src="js/app.js?v=20260818o"></script>
</body>
</html>
